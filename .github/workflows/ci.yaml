name: CI

on: [push, pull_request]

jobs:
  run-dvc-pipeline:
    runs-on: ubuntu-latest

    env:
      DAGSHUB_PAT: ${{ secrets.DAGSHUB_PAT }}
      MLFLOW_TRACKING_USERNAME: ${{ secrets.DAGSHUB_PAT }}
      MLFLOW_TRACKING_PASSWORD: ${{ secrets.DAGSHUB_PAT }}

    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: setup python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # TEMPORARY: remove once the 403 is resolved
      - name: debug DagsHub write access
        run: |
          if [ -z "$DAGSHUB_PAT" ]; then
            echo "DAGSHUB_PAT is EMPTY - secret not reaching the job"
            exit 1
          fi
          echo "PAT length: ${#DAGSHUB_PAT}"
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -u "$DAGSHUB_PAT:$DAGSHUB_PAT" \
            -H "Content-Type: application/json" \
            -d '{"experiment_id":"0"}' \
            "https://dagshub.com/Endtroducing1993/mlops-project-2.mlflow/api/2.0/mlflow/runs/create")
          echo "HTTP $code"
          [ "$code" = "200" ] || exit 1

      - name: run pipeline
        run: dvc repro

      - name: Run tests
        run: python -m unittest tests/test_model.py

      - name: Promote model to production
        if: success()
        run: python scripts/promote_model.py

      - name: Run Flask app tests
        if: success()
        run: python -m unittest discover -s tests -p "test_flask_app.py"

      - name: Log in to Docker Hub
        if: success()
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      - name: Build Docker image
        if: success()
        run: docker build -t ${{ secrets.DOCKER_HUB_USERNAME }}/emotion2:latest .

      - name: Push Docker image to Docker Hub
        if: success()
        run: docker push ${{ secrets.DOCKER_HUB_USERNAME }}/emotion2:latest